server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}

spring:
  application:
    name: inodoc-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRESQL_ADDON_HOST:localhost}:${POSTGRESQL_ADDON_PORT:5432}/${POSTGRESQL_ADDON_DB:inodoc}}
    username: ${POSTGRESQL_ADDON_USER:}
    password: ${POSTGRESQL_ADDON_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  config:
    import: optional:file:.env[.properties]

# Configuration applicative
inodoc:
  ai:
    tls:
      skip-certificate-verification: ${AI_TLS_SKIP_CERTIFICATE_VERIFICATION:false}
      trust-store-type: ${AI_TLS_TRUST_STORE_TYPE:JVM}
      trust-store: ${AI_TLS_TRUST_STORE:}
      trust-store-password: ${AI_TLS_TRUST_STORE_PASSWORD:}
    base-url: ${AI_MODEL_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_MODEL_API_KEY:}
    model: ${AI_MODEL_NAME:gpt-5.4-mini}
  media:
    bucket: ${S3_BUCKET:${AWS_S3_BUCKET_NAME:s3dev}}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${CELLAR_ADDON_HOST:cellar-c2.services.clever-cloud.com}
    access-key: ${CELLAR_ADDON_KEY_ID:}
    secret-key: ${CELLAR_ADDON_KEY_SECRET:}
  app:
    # Nom commercial affiche dans l'interface (surchargabilite via INODOC_APP_NAME).
    name: ${INODOC_APP_NAME:inoDoc}
    version: ${INODOC_APP_VERSION:1.0.0}
  admin:
    email: ${INODOC_ADMIN_EMAIL:}
    password: ${INODOC_ADMIN_PASSWORD:}
    first-name: ${INODOC_ADMIN_FIRST_NAME:Admin}
    last-name: ${INODOC_ADMIN_LAST_NAME:inoDoc}
  demo:
    enabled: ${INODOC_DEMO_DATA:false}
  sso:
    # Liste des domaines email autorises a se connecter (separes par des virgules).
    allowed-domains: ${INODOC_SSO_ALLOWED_DOMAINS:inoco.fr}
    google:
      login-redirect-uri: ${GOOGLE_LOGIN_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}
      success-redirect: ${GOOGLE_LOGIN_SUCCESS_REDIRECT:http://localhost:4200/auth/callback}
  security:
    jwt:
      secret: ${INODOC_JWT_SECRET}
      access-token-validity-minutes: 30
      refresh-token-validity-days: 7
  cors:
    allowed-origins: ${INODOC_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  share:
    base-url: ${INODOC_SHARE_BASE_URL:http://localhost:4200/share}
  mail:
    secret-key: ${INODOC_MAIL_SECRET_KEY}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/mail-accounts/oauth/callback}
      success-redirect: ${GOOGLE_SUCCESS_REDIRECT:http://localhost:4200/settings}

logging:
  level:
    com.esn.inodoc: INFO
    org.flywaydb: INFO
